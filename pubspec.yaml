name: repo_partage_plus
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^2.0.0

  # Versions figees (sans ^) : toute modification passe par une PR vers dev.

  # Carte
  flutter_map: 8.3.2
  latlong2: 0.10.1

  # Géolocalisation
  geolocator: 14.1.1

  # HTTP
  dio: 5.11.1

  # Gestion d'etat
  flutter_riverpod: 3.4.3

  # Navigation
  go_router: 18.0.2

  # Notifications (rappel de retrait, DLC proche)
  flutter_local_notifications: 22.3.1
  timezone: 0.11.1

  # Mode hors ligne
  sembast: 3.8.11
  sembast_web: 2.4.6
  path_provider: 2.1.6
  connectivity_plus: 7.3.1
  uuid: 4.6.0

  # Authentification
  firebase_core: 4.15.0
  firebase_auth: ^6.7.0

  # Itineraire vers le lieu de retrait dans OsmAnd (cartes hors ligne)
  android_intent_plus: 6.1.0
  url_launcher: 6.3.2
  rodiumai: ^0.1.1

  # Recommandations : affinage par IA via Cloud Functions, preferences dictees
  cloud_functions: 6.5.0
  speech_to_text: 7.5.0
  firebase_ai: ^4.0.0
  firebase_messaging: ^16.7.0
  firebase_storage: ^13.6.0
  image_picker: ^1.2.3

  # Graphiques (tableau de bord d'impact)
  fl_chart: 1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
