name: repo_partage_plus
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Versions figees (sans ^) : toute modification passe par une PR vers dev.

  # Carte
  flutter_map: 8.3.2
  latlong2: 0.10.1

  # Geolocalisation
  geolocator: 14.0.3

  # HTTP
  dio: 5.11.1

  # Gestion d'etat
  flutter_riverpod: 3.4.3

  # Navigation
  go_router: 17.5.0

  # Notifications (rappel de retrait, DLC proche)
  flutter_local_notifications: 22.3.1
  timezone: 0.11.1

  # Mode hors ligne
  sembast: 3.8.11
  sembast_web: 2.4.6
  path_provider: 2.1.6
  connectivity_plus: 7.3.1
  uuid: 4.6.0

  # Authentification
  firebase_core: 4.15.0
  firebase_auth: 6.7.0
  cloud_firestore: ^6.10.0
  cloud_functions: ^6.5.0
  fl_chart: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
