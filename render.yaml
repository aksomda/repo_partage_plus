# Blueprint Render : New → Blueprint → sélectionner ce dépôt.
# Les valeurs marquées sync: false sont à saisir dans le tableau de bord Render.
services:
  - type: web
    name: repas-partage-api
    runtime: node
    plan: free
    rootDir: server
    branch: main
    autoDeploy: true
    buildCommand: npm ci --omit=dev
    # Applique le schéma (idempotent) puis démarre l'API.
    startCommand: npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: '22'
      # TiDB Cloud Serverless : mysql://USER.root:MOT_DE_PASSE@HOTE:4000/repas_partage
      - key: DATABASE_URL
        sync: false
      # TiDB impose TLS.
      - key: DB_SSL
        value: 'true'
      - key: JWT_SECRET
        generateValue: true
      - key: JOBS_TOKEN
        generateValue: true
      - key: JOBS_INTERVAL_MINUTES
        value: '15'
      - key: CORS_ORIGINS
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      # L'offre gratuite de Render bloque les ports SMTP (25, 465, 587) :
      # e-mails envoyés par l'API HTTPS de Brevo.
      - key: MAIL_TRANSPORT
        value: brevo
      - key: BREVO_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: '587'
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: RODIUM_API_KEY
        sync: false
      - key: RODIUM_MODEL
        value: openai/gpt-4o-mini
