# Mise en ligne de la démo.
# - push sur main       → build web publié sur GitHub Pages
# - tag v* (ex. v1.0.0)  → APK Android et installeur Windows attachés à une release GitHub
# L'API (dossier server/) est déployée par Render à chaque push sur main (render.yaml).
#
# Prérequis : variable de dépôt API_BASE_URL (Settings → Secrets and variables
# → Actions → Variables), ex. https://repo-partage-plus.onrender.com/api

name: Déploiement

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  FLUTTER_VERSION: 3.44.9

jobs:
  web:
    name: Web → GitHub Pages
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build web
        run: >-
          flutter build web --release
          --base-href "/${{ github.event.repository.name }}/"
          --dart-define=API_BASE_URL=${{ vars.API_BASE_URL }}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
      - id: deploy
        uses: actions/deploy-pages@v4

  apk:
    name: APK → Release GitHub
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Keystore de release
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 manquant : l'APK de release doit être signé avec la clé de release."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build APK
        run: >-
          flutter build apk --release
          --dart-define=API_BASE_URL=${{ vars.API_BASE_URL }}

      - name: Renommer l'APK
        run: mv build/app/outputs/flutter-apk/app-release.apk "repas-partage-${{ github.ref_name }}.apk"

      - uses: softprops/action-gh-release@v2
        with:
          files: repas-partage-${{ github.ref_name }}.apk
          generate_release_notes: true

  windows:
    name: Installeur Windows → Release GitHub
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build Windows
        run: >-
          flutter build windows --release
          --dart-define=API_BASE_URL=${{ vars.API_BASE_URL }}

      - name: Installeur (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup -y --no-progress
            $env:Path += ";${env:ProgramFiles(x86)}\Inno Setup 6"
          }
          $version = "${{ github.ref_name }}".TrimStart('v')
          iscc "/DAppVersion=$version" windows\installer\partage_plus.iss

      - uses: softprops/action-gh-release@v2
        with:
          files: build/installer/partage-plus-setup-*.exe
          generate_release_notes: true
